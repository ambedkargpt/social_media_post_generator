# ─────────────────────────────────────────────────────────────────────────────
# deploy-lambda.yml
#
# Triggered on every push to main.
# 1. Run backend tests (pytest)
# 2. Build the Lambda container image (Dockerfile.lambda)
# 3. Push to ECR (ambedkargpt-api:latest + ambedkargpt-api:<sha>)
# 4. Update the Lambda function to the new image SHA
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN         — OIDC role ARN for GitHub Actions (arn:aws:iam::<acct>:role/...)
#   ECR_REGISTRY         — <account>.dkr.ecr.ap-south-1.amazonaws.com
#   LAMBDA_FUNCTION_URL  — (optional) Lambda Function URL for smoke test
#
# OIDC trust policy on the IAM role must allow:
#   Principal: { Federated: "arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com" }
#   Condition: { StringLike: { "token.actions.githubusercontent.com:sub": "repo:<org>/<repo>:*" } }
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Lambda

on:
  push:
    branches: [main]

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

jobs:
  # ── Job 1: Tests ────────────────────────────────────────────────────────────
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-api.txt

      - name: Install API dependencies
        run: pip install -r backend/requirements-api.txt

      - name: Pytest (unit + integration, no MongoDB required)
        env:
          PYTHONPATH: "${{ github.workspace }}"
          PYTHONUTF8: "1"
          # Stub secrets so imports resolve (no real AWS/Pinecone calls in tests)
          PINECONE_API_KEY: "test_stub"
          GEMINI_API_KEY: "test_stub"
          OPENAI_API_KEY: "test_stub"
          MONGODB_URI: "mongodb://localhost:27017/test"
          JWT_SECRET: "test_stub_secret_for_ci_only"
        run: |
          pytest backend/tests \
            -c backend/pytest.ini \
            -q \
            --tb=short

  # ── Job 2: Build + Push + Deploy ────────────────────────────────────────────
  deploy:
    name: Build → ECR → Lambda
    runs-on: ubuntu-latest
    needs: test                 # Only deploy if tests pass

    steps:
      - uses: actions/checkout@v4

      # Configure AWS credentials via OIDC (no static keys stored in Secrets)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # Login to ECR
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Build the Lambda container image
      - name: Build Lambda image
        run: |
          IMAGE_URI="${{ secrets.ECR_REGISTRY }}/ambedkargpt-api"
          docker build \
            -f Dockerfile.lambda \
            -t "${IMAGE_URI}:latest" \
            -t "${IMAGE_URI}:${{ github.sha }}" \
            .
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      # Push both tags to ECR
      - name: Push to ECR
        run: |
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${{ github.sha }}"

      # Update Lambda to use the new SHA-tagged image (immutable + traceable)
      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ambedkargpt-api \
            --image-uri "${IMAGE_URI}:${{ github.sha }}"

      # Wait until Lambda finishes updating before we consider the deploy done
      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ambedkargpt-api
          echo "Lambda updated successfully."

      # Optional smoke test — hits the health endpoint and checks for HTTP 200.
      # LAMBDA_FUNCTION_URL is stored as a GitHub *Variable* (not a Secret)
      # because it is not sensitive. Set it under Settings → Variables → Actions.
      # If the variable is unset the step is skipped automatically.
      - name: Smoke test (health check)
        if: vars.LAMBDA_FUNCTION_URL != ''
        env:
          LAMBDA_FUNCTION_URL: ${{ vars.LAMBDA_FUNCTION_URL }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${LAMBDA_FUNCTION_URL}/api/v1/health")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed — HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed — HTTP $HTTP_STATUS"

      # Print final summary to GitHub Actions job summary
      - name: Deployment summary
        run: |
          echo "## Lambda Deployment ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${IMAGE_URI}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Function | \`ambedkargpt-api\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`ap-south-1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
