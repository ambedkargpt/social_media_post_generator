<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,400..800&amp;family=Mukta:wght@400;500;600;700&amp;family=Tiro+Devanagari+Hindi:ital@0;1&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="{{t.navLabel}}" style="width: 100%; min-width: 240px; min-height: 100vh; box-sizing: border-box; background: #0F1119; border-right: 1px solid #1D212C; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; font-family: 'Mukta', system-ui, sans-serif; font-size: {{t.base}}; line-height: 1.4; color: #EDEEF2">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<a href="Dashboard.dc.html" style="color: #EDEEF2; text-decoration: none; font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 750; font-size: 22px; line-height: 1.3">{{t.brand}}<span style="color: #8FA8FF">GPT</span></a>
<button aria-label="{{t.collapse}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #262B3A; background: transparent; color: #A6ABBA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM9 4v16M15 10l-2 2 2 2"></path></svg></button>
</div>

<div style="position: relative; overflow: hidden; border-radius: 14px; background: #161A26; padding: 14px; display: flex; align-items: center; gap: 12px">
<img src="/_blob/62ef1c1552d43fd907fa48eb80aa4797" alt="" aria-hidden="true" style="position: absolute; right: -14px; top: -10px; height: 120px; opacity: 0.09">
<img src="/_blob/bf87891e7f4ed402e5be11e8b2d591fb" alt="Indian National Congress" style="width: 42px; height: 42px; border-radius: 50%; flex: none; position: relative">
<div style="display: flex; flex-direction: column; min-width: 0; position: relative; line-height: 1.3">
<span style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.party}}</span>
<span style="font-size: 13px; color: #A6ABBA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.role}}</span>
</div>
</div>

<a href="Generator.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 16px; border-radius: 12px; background: #2E56E8; color: #FFFFFF; text-decoration: none; font-family: 'Anek Devanagari', 'Mukta', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="flex: 1">{{t.newPost}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; background: rgba(255,255,255,0.18); border-radius: 6px; padding: 1px 7px">N</span>
</a>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: #8A90A2; padding: 0 12px 6px">{{t.g1}}</span>
<sc-for list="{{group1}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: {{item.bg}}; color: {{item.color}}; text-decoration: none; font-weight: {{item.weight}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{item.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1">{{item.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{item.badgeColor}}; background: {{item.badgeBg}}; border-radius: 6px; padding: 0 7px">{{item.badge}}</span>
</a>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: #8A90A2; padding: 0 12px 6px">{{t.g2}}</span>
<sc-for list="{{group2}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: {{item.bg}}; color: {{item.color}}; text-decoration: none; font-weight: {{item.weight}}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{item.iconColor}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1">{{item.label}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: {{item.badgeColor}}; background: {{item.badgeBg}}; border-radius: 6px; padding: 0 7px">{{item.badge}}</span>
</a>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 12px; background: #13161F; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 13px; color: #C9CCD6">{{t.quota}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #EDEEF2">2/5</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<span style="height: 6px; border-radius: 3px; background: #8FA8FF"></span><span style="height: 6px; border-radius: 3px; background: #8FA8FF"></span><span style="height: 6px; border-radius: 3px; background: #262B3A"></span><span style="height: 6px; border-radius: 3px; background: #262B3A"></span><span style="height: 6px; border-radius: 3px; background: #262B3A"></span>
</div>
</div>

<sc-if value="{{showPlayer}}" hint-placeholder-val="{{ true }}">
<div style="border-radius: 12px; background: #13161F; padding: 10px 12px; display: flex; align-items: center; gap: 12px">
<button aria-label="{{t.play}}" style="width: 38px; height: 38px; flex: none; border-radius: 50%; border: 0; background: #EDEEF2; color: #0B0D14; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg></button>
<div style="display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3">
<span style="font-size: 12px; font-weight: 700; color: #F0705A">● {{t.onAir}}</span>
<span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.bulletin}}</span>
</div>
<div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 18px">
<span style="width: 3px; height: 40%; background: #8FA8FF; border-radius: 2px"></span><span style="width: 3px; height: 90%; background: #8FA8FF; border-radius: 2px"></span><span style="width: 3px; height: 60%; background: #8FA8FF; border-radius: 2px"></span><span style="width: 3px; height: 100%; background: #8FA8FF; border-radius: 2px"></span>
</div>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 10px; padding: 8px 6px 0; border-top: 1px solid #1D212C">
<span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #2E56E8; display: flex; align-items: center; justify-content: center; font-family: 'Anek Devanagari', sans-serif; font-weight: 700; font-size: 16px; line-height: 1">{{t.initial}}</span>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.3"><span style="font-weight: 600; font-size: 15px">{{t.name}}</span><span style="font-size: 13px; color: #A6ABBA">{{t.place}}</span></div>
<button aria-label="{{t.lang}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #262B3A; background: transparent; color: #C9CCD6; font-family: 'Mukta', sans-serif; font-weight: 600; font-size: 13px">{{t.langShort}}</button>
<a href="Settings.dc.html" aria-label="{{t.settings}}" aria-current="{{settingsCurrent}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid {{settingsBorder}}; background: {{settingsBg}}; color: {{settingsColor}}; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></a>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["today","create","posts","bhimbot","radio","music","settings"],"default":"today"},"lang":{"editor":"enum","options":["en","hi"],"default":"en"},"$preview":{"width":272,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const cur = this.props.current ?? 'today';
const hi = (this.props.lang ?? 'en') === 'hi';
const t = hi ? {
navLabel: 'मुख्य', brand: 'अंबेडकर', collapse: 'साइडबार छोटा करें', party: 'इंडियन नेशनल कांग्रेस', role: 'ज़िला महासचिव · नागपुर', newPost: 'नई पोस्ट', g1: 'कार्यक्षेत्र', g2: 'सीखें और सुनें', quota: 'आज की पोस्ट', play: 'आज का बुलेटिन सुनें', onAir: 'प्रसारण जारी', bulletin: 'आज का बुलेटिन · हिंदी', initial: 'भा', name: 'भार्गव', place: 'नागपुर, महाराष्ट्र', lang: 'अंग्रेज़ी में बदलें', langShort: 'EN', settings: 'सेटिंग्स', base: '17px'
} : {
navLabel: 'Main', brand: 'Ambedkar', collapse: 'Collapse sidebar', party: 'Indian National Congress', role: 'DCC General Secretary · Nagpur', newPost: 'New post', g1: 'Workspace', g2: 'Learn & listen', quota: 'Posts today', play: "Play today's bulletin", onAir: 'ON AIR', bulletin: "Today's bulletin · Hindi", initial: 'B', name: 'Bhargav', place: 'Nagpur, Maharashtra', lang: 'Switch to Hindi', langShort: 'हिं', settings: 'Settings', base: '16px'
};
const mk = (id, label, href, icon, badge, badgeKind) => {
const on = id === cur;
const live = badgeKind === 'live';
return {
label, href, icon, badge: badge || '',
current: on ? 'page' : 'false',
bg: on ? '#1C2133' : 'transparent',
color: on ? '#EDEEF2' : '#C9CCD6',
weight: on ? '600' : '500',
iconColor: on ? '#8FA8FF' : '#A6ABBA',
badgeColor: live ? '#0B0D14' : '#A6ABBA',
badgeBg: live ? '#F0705A' : (badge ? '#1C2133' : 'transparent')
};
};
const group1 = [
mk('today', hi ? 'आज' : 'Today', 'Dashboard.dc.html', 'M3 10.5L12 4l9 6.5V20H3zM9 20v-6h6v6'),
mk('create', hi ? 'बनाएँ' : 'Create', 'Services.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7'),
mk('posts', hi ? 'मेरी पोस्ट' : 'My posts', 'PostHistory.dc.html', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h4', '42')
];
const group2 = [
mk('bhimbot', hi ? 'भीमबॉट' : 'BhimBot', 'BhimBot.dc.html', 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z'),
mk('radio', hi ? 'भीम रेडियो' : 'Bhim Radio', 'BhimRadio.dc.html', 'M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14M12 11v2', hi ? 'लाइव' : 'LIVE', 'live'),
mk('music', hi ? 'संगीत स्टूडियो' : 'Music studio', 'Music.dc.html', 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0a3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0a3 3 0 0 1 6 0z')
];
const s = cur === 'settings';
return {
t, group1, group2,
showPlayer: cur !== 'radio',
settingsCurrent: s ? 'page' : 'false',
settingsBorder: s ? '#8FA8FF' : '#262B3A',
settingsBg: s ? '#1C2133' : 'transparent',
settingsColor: s ? '#8FA8FF' : '#C9CCD6'
};
}
}
</script>
</body>
</html>
